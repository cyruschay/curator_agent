# "deepseek-r1:14b" "qwen3-vl:30b-a3b-thinking" "nemotron-3-nano:30b" "gpt-oss:20b"
ollama_models:
  reasoning_model: "gpt-oss:20b"
  mini_model: "gpt-oss:20b"
  nano_model: "gpt-oss:20b"

ollama_params:
  reasoning_model:
    reasoning: true
    num_predict: 8192
    temperature: 0.2
    top_p: 0.9
    top_k: 40
    repeat_penalty: 1.15
    repeat_last_n: 256
    seed: 2026
    extra: {}
  mini_model:
    reasoning: true
    num_predict: 4096
    temperature: 0.4
    extra: {}
  nano_model:
    reasoning: false
    num_predict: 2048
    temperature: 0.2
    extra: {}

paths:
  input_abstracts: "abstracts_debug.jsonl"
  curation_output_dir: "gpt-oss-20b-debug-10-200"
